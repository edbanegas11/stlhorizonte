<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STL HORIZONTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50">
    

    <div id="app" class="max-w-md mx-auto pb-32">
        <main id="main-content" class="px-6 mt-4 pb-40">
            
            <section id="view-dashboard" class="space-y-6">
    <header class="bg-slate-900 text-white p-8 rounded-b-[3.5rem] shadow-2xl relative overflow-hidden -mx-6 -mt-4 mb-8">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-slate-800 rounded-full opacity-50"></div>
        
        <div class="relative z-10 flex justify-between items-center mb-6">
            <a href="index.html" class="bg-white/10 backdrop-blur-md p-2.5 rounded-xl border border-white/10 active:scale-90 transition-transform flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="text-[9px] font-black text-white uppercase tracking-tighter">MENÚ</span>
            </a>

            <h1 class="font-black italic text-[11px] uppercase tracking-widest text-slate-400">
                STE Turismo <span class="text-white">Horizonte</span>
            </h1>
        </div>
        
        <div class="text-center relative z-10 py-4">
            <p class="text-[10px] uppercase text-slate-500 font-bold tracking-[0.3em] mb-1">Caja Disponible</p>
            <h2 id="balance-total" class="text-5xl font-black tracking-tighter text-emerald-400 drop-shadow-sm">
                L 0.00
            </h2>
        </div>
    </header>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="showView('income')" class="bg-white p-6 rounded-[2.5rem] shadow-xl border-b-4 border-emerald-500 active:scale-95 transition-all flex flex-col items-center">
                        <span class="text-emerald-500 font-black text-xs uppercase">+ Ingresos</span>
                    </button>
                    <button onclick="showView('expense')" class="bg-white p-6 rounded-[2.5rem] shadow-xl border-b-4 border-red-500 active:scale-95 transition-all flex flex-col items-center">
                        <span class="text-red-500 font-black text-xs uppercase">- Gastos</span>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-[8px] font-black uppercase text-slate-400 tracking-widest">Total Ingresos</p>
                        <p id="dash-total-in" class="text-lg font-black text-emerald-600">L 0.00</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-[8px] font-black uppercase text-slate-400 tracking-widest">Total Gastos</p>
                        <p id="dash-total-out" class="text-lg font-black text-red-600">L 0.00</p>
                    </div>
                </div>

                <h3 class="text-[10px] font-black uppercase text-slate-400 mt-8 italic tracking-widest text-center">Movimientos Recientes</h3>
                <div id="lista-transacciones" class="space-y-3"></div>
            </section>

            <section id="view-income" class="hidden bg-white p-8 rounded-[3rem] shadow-2xl space-y-6">
                <h2 class="text-lg font-black text-emerald-600 uppercase italic">Nuevo Ingreso</h2>
                <div class="space-y-4">
                    <div>
                        <p class="text-[9px] font-black uppercase text-slate-400 ml-2 mb-1">Descripción / Cliente</p>
                        <input type="text" id="in-description" class="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none border-none focus:ring-2 focus:ring-emerald-500 uppercase" placeholder="EJ: GRUPO FAMILIAR COPAN" oninput="this.value = this.value.toUpperCase()">
                    </div>
                    <div>
                        <p class="text-[9px] font-black uppercase text-slate-400 ml-2 mb-1">Monto Lps</p>
                        <input type="number" id="in-amount" class="w-full p-4 bg-slate-50 rounded-2xl font-black text-xl outline-none" placeholder="0.00">
                    </div>
                    <div>
                        <p class="text-[9px] font-black uppercase text-slate-400 ml-2 mb-1">Unidad</p>
                        <select id="in-unit" class="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none"></select>
                    </div>
                    <div>
                        <p class="text-[9px] font-black uppercase text-slate-400 ml-2 mb-1">Categoría</p>
                        <select id="in-category" class="w-full p-4 bg-slate-50 rounded-2xl font-bold text-sm outline-none"></select>
                    </div>
                    <button onclick="saveIncome()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-all">Confirmar</button>
                    <button onclick="showView('dashboard')" class="w-full text-slate-400 font-black text-[10px] uppercase">Cancelar</button>
                </div>
            </section>

            <section id="view-expense" class="hidden bg-white p-6 rounded-[3rem] shadow-2xl space-y-6">
                <h2 class="text-lg font-black text-red-600 uppercase italic">Registro de Gastos</h2>
                <div class="space-y-4">
                    <select id="ex-unit" class="w-full p-4 bg-slate-100 rounded-2xl font-bold text-sm outline-none border-none focus:ring-2 focus:ring-red-500"></select>
                    <div id="container-categorias-dinamicas" class="grid grid-cols-1 gap-3 max-h-[45vh] overflow-y-auto pr-2 custom-scroll"></div>
                    <div class="pt-4 space-y-3">
                        <button onclick="saveMultipleExpenses()" class="w-full bg-red-600 text-white py-4 rounded-3xl font-black uppercase shadow-lg active:scale-95">Guardar Gastos</button>
                        <button onclick="showView('dashboard')" class="w-full text-slate-400 font-black text-[10px] uppercase tracking-widest text-center block">Cancelar</button>
                    </div>
                </div>
            </section>

            <section id="view-history" class="hidden mt-8 space-y-6 pb-10">
                <div class="flex justify-between items-end px-2">
                    <h2 class="text-2xl font-black italic uppercase tracking-tighter">Reporte <span class="text-emerald-500">Financiero</span></h2>
                    <button onclick="exportData()" class="bg-slate-200 text-slate-600 px-4 py-2 rounded-xl active:scale-95 text-[9px] font-black uppercase italic">Exportar</button>
                </div>
                <div class="flex bg-slate-200 p-1 rounded-2xl">
                    <button id="btn-report-inc" onclick="setReportSubView('income')" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest bg-white text-emerald-600 shadow-sm">Ingresos</button>
                    <button id="btn-report-exp" onclick="setReportSubView('expense')" class="flex-1 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest text-slate-500">Gastos</button>
                </div>
                <div id="historial-agrupado" class="space-y-6"></div>
            </section>

            <section id="view-settings" class="hidden mt-8 space-y-6 pb-10">
                <h2 class="text-2xl font-black italic uppercase tracking-tighter text-slate-800">Ajustes</h2>
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 space-y-4">
                        <h3 class="text-[10px] font-black uppercase text-slate-800 tracking-widest italic">Gestionar Unidades</h3>
                        <div id="lista-unidades-ajustes" class="space-y-2"></div>
                        <div class="flex gap-2">
                            <input type="text" id="new-unit-input" class="flex-1 bg-slate-100 p-3 rounded-xl text-xs font-bold uppercase outline-none" placeholder="Nueva unidad...">
                            <button onclick="addUnit()" class="bg-slate-900 text-white px-4 rounded-xl font-black">+</button>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 space-y-4">
                        <h3 class="text-[10px] font-black uppercase text-slate-800 tracking-widest italic">Categorías Ingresos</h3>
                        <div id="lista-cat-ingresos-ajustes" class="space-y-2"></div>
                        <div class="flex gap-2">
                            <input type="text" id="new-cat-in-input" class="flex-1 bg-slate-100 p-3 rounded-xl text-xs font-bold uppercase outline-none" placeholder="Nueva cat...">
                            <button onclick="addCatIngreso()" class="bg-slate-900 text-white px-4 rounded-xl font-black">+</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-6 left-4 right-4 bg-slate-900/95 backdrop-blur-xl border border-slate-700 p-4 flex justify-around items-center z-50 max-w-md mx-auto rounded-[2.5rem] shadow-2xl">
            <button id="nav-home" onclick="showView('dashboard')" class="flex flex-col items-center gap-1">
                <svg class="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="text-[9px] font-black uppercase tracking-widest text-emerald-400 italic">Inicio</span>
            </button>
            <button id="nav-reports" onclick="showView('history')" class="flex flex-col items-center gap-1 opacity-50">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span class="text-[9px] font-black uppercase tracking-widest text-white italic">Reportes</span>
            </button>
            <button id="nav-settings" onclick="showView('settings')" class="flex flex-col items-center gap-1 opacity-50">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                <span class="text-[9px] font-black uppercase tracking-widest text-white italic">Ajustes</span>
            </button>
        </nav>
    </div>

    <script type="module" src="turismo.js"></script>
</body>
</html>
